plugins {
    id "com.android.application"
}

def cpmSourceCacheDir = System.getenv("HOME") + "/.cache/CPM/usf2plugin"

android {
    namespace = "org.androidaudioplugin.ports.juce.usf2plugin"
    compileSdk = libs.versions.android.compileSdk.get().toInteger()

    defaultConfig {
        applicationId = "org.androidaudioplugin.ports.juce.usf2plugin"
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = libs.versions.android.targetSdk.get().toInteger()
        versionCode = 1
        versionName = "0.1.0"

        ndk {
            abiFilters "x86_64", "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DAAP_DIR=${System.env.AAP_DIR ?: "$projectDir/../external/aap-core"}",
                          "-DAAP_JUCE_DIR=${System.env.AAP_JUCE_DIR ?: "$projectDir/../external/aap-juce"}",
                          "-DCPM_SOURCE_CACHE=$cpmSourceCacheDir",
                          "-DUSF2PLUGIN_BUILD_CLAP=OFF",
                          "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
                          "-DANDROID_STL=c++_shared",
                          "-DANDROID_CPP_FEATURES=exceptions rtti"
            }
        }

        proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = libs.versions.cmake.get()
        }
    }

    sourceSets {
        main.java.srcDirs += [
            "../external/usf2plugin/modules/juce/modules/juce_gui_basics/native/java/app",
            "../external/usf2plugin/modules/juce/modules/juce_gui_basics/native/javaopt/app",
            "../external/aap-juce/java"
        ]
    }

    dependencies {
        implementation libs.androidx.core.ktx
        implementation libs.startup.runtime
        implementation libs.aap.core
        implementation libs.aap.midi.device.service
        implementation libs.aap.ui.web
        implementation libs.aap.ui.compose
        implementation libs.aap.ui.compose.app
    }

    buildFeatures {
        prefab = true
    }

    ndkVersion = libs.versions.ndk.get()

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// CMake population creates the stable JUCE source symlink used by sourceSets.
afterEvaluate {
    def configureCMakeTasks = tasks.matching { it.name.startsWith("configureCMake") }
    tasks.matching {
        it.name.matches("compile.*JavaWithJavac") ||
            it.name.startsWith("lintAnalyze") ||
            it.name.startsWith("lintVitalAnalyze")
    }.configureEach {
        dependsOn configureCMakeTasks
    }
}
